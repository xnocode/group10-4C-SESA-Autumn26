<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Open arrow for Navigable Association / Dependency -->
    <marker id="navArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.8" />
    </marker>

    <!-- Solid Diamond for Composition -->
    <marker id="composition" viewBox="0 0 16 12" refX="15" refY="6" markerWidth="12" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 6 L 8 1 L 15 6 L 8 11 Z" fill="#000000" stroke="#000000" stroke-width="1.5"/>
    </marker>

    <!-- Open Triangle for Generalization/Inheritance -->
    <marker id="generalization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Title Header (Pure Black & White) -->
  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">Class Diagram: UniShare Object-Oriented Architecture</text>
  <text x="640" y="54" text-anchor="middle" font-size="12" font-style="italic" fill="#000000">Unified Modeling Language (UML 2.5) · Domain Entities, Services &amp; Utility Engines</text>

  <!-- ================= CLASS 1: User (Center Top) ================= -->
  <g transform="translate(480, 80)">
    <!-- Class Box Outer -->
    <rect x="0" y="0" width="310" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- Header Compartment -->
    <text x="155" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">User</text>
    <line x1="0" y1="30" x2="310" y2="30" stroke="#000000" stroke-width="1.5"/>
    <!-- Attributes Compartment -->
    <text x="12" y="48" font-size="11" fill="#000000">- id : String [CUID]</text>
    <text x="12" y="66" font-size="11" fill="#000000">- email : String [Unique .edu.bd]</text>
    <text x="12" y="84" font-size="11" fill="#000000">- fullName : String</text>
    <text x="12" y="102" font-size="11" fill="#000000">- passwordHash : String [Scrypt]</text>
    <text x="12" y="120" font-size="11" fill="#000000">- tokenBalance : Int = 50</text>
    <text x="12" y="138" font-size="11" fill="#000000">- verified : Boolean = false</text>
    <!-- Methods Compartment -->
    <line x1="0" y1="146" x2="310" y2="146" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="165" font-size="10.5" fill="#000000">+ verifyEmail(otp: String): Boolean</text>
    <text x="12" y="183" font-size="10.5" fill="#000000">+ transferTokens(peerId: String, amt: Int): TxResult</text>
    <text x="12" y="201" font-size="10.5" fill="#000000">+ updateKycVerification(idCard: String): void</text>
    <text x="12" y="219" font-size="10.5" fill="#000000">+ getActiveEscrows(): List&lt;MarketplaceRental&gt;</text>
  </g>

  <!-- ================= CLASS 2: MarketplaceListing (Left Top) ================= -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="300" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="150" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">MarketplaceListing</text>
    <line x1="0" y1="30" x2="300" y2="30" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="48" font-size="11" fill="#000000">- id : String [CUID]</text>
    <text x="12" y="66" font-size="11" fill="#000000">- sellerId : String [FK]</text>
    <text x="12" y="84" font-size="11" fill="#000000">- title : String</text>
    <text x="12" y="102" font-size="11" fill="#000000">- category : ItemCategory</text>
    <text x="12" y="120" font-size="11" fill="#000000">- ratePerDay : Int</text>
    <text x="12" y="138" font-size="11" fill="#000000">- depositAmount : Int [Escrow]</text>
    <line x1="0" y1="146" x2="300" y2="146" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="165" font-size="10.5" fill="#000000">+ createListing(): Boolean</text>
    <text x="12" y="183" font-size="10.5" fill="#000000">+ toggleAvailability(status: Boolean): void</text>
    <text x="12" y="201" font-size="10.5" fill="#000000">+ calculateTotalFee(days: Int): Int</text>
    <text x="12" y="219" font-size="10.5" fill="#000000">+ deleteListing(): Boolean</text>
  </g>

  <!-- ================= CLASS 3: MarketplaceRental (Left Center) ================= -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="300" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="150" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">MarketplaceRental</text>
    <line x1="0" y1="30" x2="300" y2="30" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="48" font-size="11" fill="#000000">- id : String [CUID]</text>
    <text x="12" y="66" font-size="11" fill="#000000">- listingId : String [FK]</text>
    <text x="12" y="84" font-size="11" fill="#000000">- borrowerId : String [FK]</text>
    <text x="12" y="102" font-size="11" fill="#000000">- lenderId : String [FK]</text>
    <text x="12" y="120" font-size="11" fill="#000000">- totalLocked : Int [Escrow Deposit]</text>
    <text x="12" y="138" font-size="11" fill="#000000">- status : RentalStatus</text>
    <line x1="0" y1="146" x2="300" y2="146" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="165" font-size="10.5" fill="#000000">+ lockAtomicEscrow(): Boolean</text>
    <text x="12" y="183" font-size="10.5" fill="#000000">+ settleReturnAndRefund(): RefundResult</text>
    <text x="12" y="201" font-size="10.5" fill="#000000">+ raiseDamageDispute(note: String): void</text>
    <text x="12" y="219" font-size="10.5" fill="#000000">+ cancelRentalAgreement(): Boolean</text>
  </g>

  <!-- ================= CLASS 4: WalletTransaction (Right Top) ================= -->
  <g transform="translate(900, 80)">
    <rect x="0" y="0" width="310" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="155" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">WalletTransaction</text>
    <line x1="0" y1="30" x2="310" y2="30" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="48" font-size="11" fill="#000000">- id : String [CUID]</text>
    <text x="12" y="66" font-size="11" fill="#000000">- userId : String [FK]</text>
    <text x="12" y="84" font-size="11" fill="#000000">- type : TransactionType</text>
    <text x="12" y="102" font-size="11" fill="#000000">- amount : Int [Signed Delta +/-]</text>
    <text x="12" y="120" font-size="11" fill="#000000">- balanceAfter : Int</text>
    <text x="12" y="138" font-size="11" fill="#000000">- createdAt : DateTime</text>
    <line x1="0" y1="146" x2="310" y2="146" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="165" font-size="10.5" fill="#000000">+ recordAtomicDebit(amt: Int): Boolean</text>
    <text x="12" y="183" font-size="10.5" fill="#000000">+ recordAtomicCredit(amt: Int): Boolean</text>
    <text x="12" y="201" font-size="10.5" fill="#000000">+ verifyIntegrityChecksum(): Boolean</text>
    <text x="12" y="219" font-size="10.5" fill="#000000">+ getStatementSummary(): TxHistory</text>
  </g>

  <!-- ================= CLASS 5: TravelJourney (Center Middle) ================= -->
  <g transform="translate(480, 390)">
    <rect x="0" y="0" width="310" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="155" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">TravelJourney</text>
    <line x1="0" y1="30" x2="310" y2="30" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="48" font-size="11" fill="#000000">- id : String [CUID]</text>
    <text x="12" y="66" font-size="11" fill="#000000">- userId : String [FK]</text>
    <text x="12" y="84" font-size="11" fill="#000000">- origin : LocationCoord</text>
    <text x="12" y="102" font-size="11" fill="#000000">- destination : LocationCoord</text>
    <text x="12" y="120" font-size="11" fill="#000000">- departureTime : DateTime</text>
    <text x="12" y="138" font-size="11" fill="#000000">- status : JourneyStatus</text>
    <line x1="0" y1="146" x2="310" y2="146" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="165" font-size="10.5" fill="#000000">+ matchCorridor(thresholdKm: Float): List&lt;Ride&gt;</text>
    <text x="12" y="183" font-size="10.5" fill="#000000">+ updateLiveTelemetry(lat: Float, lng: Float): void</text>
    <text x="12" y="201" font-size="10.5" fill="#000000">+ completeJourney(): void</text>
    <text x="12" y="219" font-size="10.5" fill="#000000">+ cancelJourney(reason: String): Boolean</text>
  </g>

  <!-- ================= CLASS 6: GeoMathEngine (Utility - Bottom Left) ================= -->
  <g transform="translate(60, 680)">
    <rect x="0" y="0" width="350" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="175" y="18" text-anchor="middle" font-size="11" font-style="italic" fill="#000000">&lt;&lt;Utility / Geodesy Engine&gt;&gt;</text>
    <text x="175" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">GeoMathEngine</text>
    <line x1="0" y1="42" x2="350" y2="42" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="60" font-size="10.5" font-style="italic" fill="#000000">- EARTH_RADIUS_KM : Float = 6371.0</text>
    <text x="12" y="78" font-size="10.5" font-style="italic" fill="#000000">- DHAKA_ROAD_DETOUR : Float = 1.32</text>
    <line x1="0" y1="88" x2="350" y2="88" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="106" font-size="10" fill="#000000">+ computeHaversineKm(p1: Coord, p2: Coord): Float</text>
    <text x="12" y="124" font-size="10" fill="#000000">+ calculateDhakaRoadDistance(straightKm: Float): Float</text>
    <text x="12" y="142" font-size="10" fill="#000000">+ projectToWebMercator(lat: Float, lng: Float, z: Int): Point</text>
    <text x="12" y="160" font-size="10" fill="#000000">+ generateBezierCurvedPath(p1: Point, p2: Point): String</text>
    <text x="12" y="178" font-size="10" fill="#000000">+ calculateCarbonSavings(distanceKm: Float): Float</text>
  </g>

  <!-- ================= CLASS 7: UltraMsgGateway (Service - Bottom Right) ================= -->
  <g transform="translate(860, 680)">
    <rect x="0" y="0" width="350" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="175" y="18" text-anchor="middle" font-size="11" font-style="italic" fill="#000000">&lt;&lt;Telephony Cloud Gateway&gt;&gt;</text>
    <text x="175" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">UltraMsgGateway</text>
    <line x1="0" y1="42" x2="350" y2="42" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="60" font-size="10.5" fill="#000000">- instanceId : String</text>
    <text x="12" y="78" font-size="10.5" fill="#000000">- token : String</text>
    <line x1="0" y1="88" x2="350" y2="88" stroke="#000000" stroke-width="1.5"/>
    <text x="12" y="106" font-size="10" fill="#000000">+ sendWhatsAppOtp(phone: String, otp: String): Boolean</text>
    <text x="12" y="124" font-size="10.5" fill="#000000">+ dispatchRentalConfirmation(phone: String, msg: String): void</text>
    <text x="12" y="142" font-size="10" fill="#000000">+ broadcastSosEmergencyAlert(contacts: List, url: String): void</text>
    <text x="12" y="160" font-size="10" fill="#000000">+ verifyWebhookSignature(payload: String): Boolean</text>
    <text x="12" y="178" font-size="10" fill="#000000">+ getMessageDeliveryStatus(msgId: String): Status</text>
  </g>

  <!-- ================= RELATIONSHIPS & ASSOCIATIONS (BLACK & WHITE) ================= -->

  <!-- User 1 -> 0..* MarketplaceListing -->
  <line x1="480" y1="150" x2="360" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#navArrow)"/>
  <text x="460" y="142" font-size="10.5" font-weight="bold" fill="#000000">1</text>
  <text x="375" y="142" font-size="10.5" font-weight="bold" fill="#000000">0..*</text>
  <text x="420" y="168" text-anchor="middle" font-size="9.5" font-weight="500" fill="#000000">publishes &gt;</text>

  <!-- MarketplaceListing 1 -> 0..* MarketplaceRental -->
  <line x1="210" y1="310" x2="210" y2="390" stroke="#000000" stroke-width="1.5" marker-end="url(#navArrow)"/>
  <text x="218" y="330" font-size="10.5" font-weight="bold" fill="#000000">1</text>
  <text x="218" y="380" font-size="10.5" font-weight="bold" fill="#000000">0..*</text>
  <text x="245" y="355" font-size="9.5" font-weight="500" fill="#000000">rented via</text>

  <!-- User 1 -> 0..* MarketplaceRental (borrows) -->
  <path d="M 480 230 L 360 410" stroke="#000000" stroke-width="1.5" marker-end="url(#navArrow)"/>
  <text x="450" y="245" font-size="10.5" font-weight="bold" fill="#000000">1</text>
  <text x="370" y="395" font-size="10.5" font-weight="bold" fill="#000000">0..*</text>
  <text x="425" y="315" text-anchor="middle" font-size="9.5" font-weight="500" fill="#000000">borrows &gt;</text>

  <!-- User 1 -> 1..* WalletTransaction (Composition) -->
  <line x1="790" y1="150" x2="900" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#composition)"/>
  <text x="805" y="142" font-size="10.5" font-weight="bold" fill="#000000">1</text>
  <text x="880" y="142" font-size="10.5" font-weight="bold" fill="#000000">1..*</text>
  <text x="845" y="168" text-anchor="middle" font-size="9.5" font-weight="500" fill="#000000">&lt; ledger</text>

  <!-- User 1 -> 0..* TravelJourney -->
  <line x1="635" y1="310" x2="635" y2="390" stroke="#000000" stroke-width="1.5" marker-end="url(#navArrow)"/>
  <text x="645" y="330" font-size="10.5" font-weight="bold" fill="#000000">1</text>
  <text x="645" y="380" font-size="10.5" font-weight="bold" fill="#000000">0..*</text>
  <text x="675" y="355" font-size="9.5" font-weight="500" fill="#000000">schedules</text>

  <!-- TravelJourney uses GeoMathEngine (Dependency) -->
  <path d="M 500 620 L 410 710" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#navArrow)"/>
  <rect x="425" y="650" width="60" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="455" y="663" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">&lt;&lt;uses&gt;&gt;</text>

  <!-- MarketplaceRental locks escrow with WalletTransaction (Dependency cleanly routed above TravelJourney) -->
  <path d="M 360 410 C 420 350, 480 340, 635 340 C 760 340, 830 290, 900 240" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#navArrow)"/>
  <rect x="585" y="331" width="100" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="635" y="344" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">&lt;&lt;locks escrow&gt;&gt;</text>

  <!-- MarketplaceRental notifies UltraMsgGateway (Dependency routed cleanly below TravelJourney) -->
  <path d="M 360 560 Q 610 650 860 740" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#navArrow)"/>
  <rect x="580" y="640" width="80" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="620" y="653" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">&lt;&lt;notifies&gt;&gt;</text>

</svg>
